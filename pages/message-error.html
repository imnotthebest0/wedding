<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f0e2">
    <title>Service Unavailable | Animesh &amp; Arpita Wedding</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/message-error.css">
<link rel="stylesheet" href="../assets/css/premium.css">
</head>
<body class="message-error-page">
    <main class="message-error-card" aria-labelledby="message-error-title">
        <div class="message-error-animation" aria-hidden="true">
            <span class="message-error-orbit message-error-orbit-one"></span>
            <span class="message-error-orbit message-error-orbit-two"></span>
            <svg viewBox="0 0 64 64" role="presentation">
                <path d="M18 45h28a10 10 0 0 0 1-20 16 16 0 0 0-30-2 11 11 0 0 0 1 22Z"/>
                <path d="M32 27v10m0 7h.01"/>
            </svg>
        </div>
        <p class="message-error-code">SERVICE UNAVAILABLE</p>
        <h1 id="message-error-title">Service Unavailable</h1>
        <p class="message-error-description">We couldn't connect to the messaging service. Please try again later.</p>
        <a class="message-error-back" href="../index.html">Return to the wedding page</a>
    </main>
    <div id="persistent-music-player">
        <audio id="wedding-music" class="wedding-music-player" src="../assets/audio/wedding-shehnai.mp3" preload="metadata" aria-label="Wedding shehnai music" hidden></audio>
        <span id="music-player-status" class="music-player-status" role="status" aria-live="polite"></span>
    </div>
    <script src="../assets/js/scroll-cue.js" defer></script>
    <script src="../assets/js/music.js" defer></script>
    <script src="../assets/js/premium.js" defer></script>
</body>
</html>
