<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f0e2">
    <title>Groom's Wedding Card | Animesh &amp; Arpita Wedding</title>
    <link rel="stylesheet" href="../assets/css/wedding-card.css">
<link rel="stylesheet" href="../assets/css/premium.css">
</head>
<body>
    <main class="wedding-card-page">
        <svg class="wedding-card-icon" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="15" r="8" />
            <path d="M9 42c0-9 6-16 15-16s15 7 15 16" />
            <path d="M17 8l7-5 7 5" />
        </svg>
        <h1>Groom's Wedding Card</h1>
        <div class="groom-photo-row">
            <img class="groom-portrait" src="../assets/images/groom-portrait.png" alt="Portrait of the groom wearing a black shirt and sunglasses">
            <img class="groom-signature" src="../assets/images/groom-signature.svg" alt="Handwritten-style signature reading Animesh">
        </div>
        <a class="wedding-card-back" href="../index.html">Return to the wedding page</a>
    </main>
    <div id="persistent-music-player">
        <audio id="wedding-music" class="wedding-music-player" src="../assets/audio/wedding-shehnai.mp3" preload="metadata" aria-label="Wedding shehnai music" hidden></audio>
        <span id="music-player-status" role="status" aria-live="polite"></span>
    </div>
    <script src="../assets/js/scroll-cue.js" defer></script>
    <script src="../assets/js/music.js" defer></script>
    <script src="../assets/js/premium.js" defer></script>
</body>
</html>
