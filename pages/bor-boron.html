<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বরবরণ এবং পট্টবস্ত্র | Animesh &amp; Arpita Wedding</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/ceremony-page.css">
<link rel="stylesheet" href="../assets/css/premium.css">

<body class="ceremony-detail-page">
    <a class="ceremony-back-link" href="../index.html#bor-boron">← Back</a>
    <main class="ceremony-file-page bor-boron-section" aria-label="বরবরণ এবং পট্টবস্ত্র">
        <header class="ceremony-file-heading">
            <h1>বরবরণ এবং পট্টবস্ত্র</h1>
        </header>
        <section class="ceremony-extra-content" aria-label="Additional ceremony details">
            <section class="ceremony-photo-gallery" aria-labelledby="photo-gallery-title">
                <h2 id="photo-gallery-title">Share photos, video</h2>
                <p class="ceremony-photo-gallery-description">View photos shared by other guests, add your own to the shared album, and talk with other guests in the group chat.</p>
                <a class="ceremony-photo-gallery-link" href="https://photos.app.goo.gl/CdMu52KywsavvXfi7" aria-label="Share photos and videos on Google Photos">
                    <svg class="ceremony-photo-gallery-icon" viewBox="0 0 32 32" aria-hidden="true">
                        <path fill="#4285F4" d="M16 2a7 7 0 0 0-7 7v5h7a7 7 0 0 0 0-12Z"/>
                        <path fill="#34A853" d="M30 16a7 7 0 0 0-7-7h-5v7a7 7 0 0 0 12 0Z"/>
                        <path fill="#FBBC04" d="M16 30a7 7 0 0 0 7-7v-5h-7a7 7 0 0 0 0 12Z"/>
                        <path fill="#EA4335" d="M2 16a7 7 0 0 0 7 7h5v-7A7 7 0 0 0 2 16Z"/>
                    </svg>
                    <span>Photo/Video</span>
                </a>
                <a class="wedding-chat-link wedding-chat-unavailable ceremony-chat-link" href="message-error.html" aria-label="Message guests on WhatsApp, currently unavailable">
                    <svg class="wedding-chat-icon" viewBox="0 0 32 32" aria-hidden="true">
                        <circle cx="16" cy="15" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/>
                        <path d="M7 25l1.5-5M12 9.5c.5-.6 1.2-.5 1.6.1l1.2 1.8c.3.5.2 1-.2 1.4l-.8.8c1 1.8 2.4 3.2 4.2 4.2l.8-.8c.4-.4.9-.5 1.4-.2l1.8 1.2c.6.4.7 1.1.1 1.6-1.1 1.1-2.6 1.4-4.1.8-3.8-1.5-6.8-4.5-8.3-8.3-.6-1.5-.3-3 .8-4.1Z" fill="currentColor"/>
                    </svg>
                    <span>Message</span>
                </a>
            </section>
        </section>
    </main>
    <div id="persistent-music-player">
        <audio id="wedding-music" class="wedding-music-player" src="../assets/audio/wedding-shehnai.mp3" preload="metadata" aria-label="Wedding shehnai music" hidden></audio>
        <span id="music-player-status" class="music-player-status" role="status" aria-live="polite"></span>
    </div>
    <script src="../assets/js/scroll-cue.js" defer></script>
    <script src="../assets/js/music.js" defer></script>
    <script src="../assets/js/premium.js" defer></script>
